[package]
name = "aoc-rust"
version = "0.1.2"
edition = "2024"
description = "A tiny ergonomic helper crate for advent-of-code"
license = "MIT OR Apache-2.0"
repository = "https://github.com/zaperfish/aoc-rust"
readme = "README.md"
keywords = ["advent-of-code", "aoc"]

[dependencies]
clap = { version = "4.6.8", features = ["derive"] }
reqwest = { version = "0.13.5", features = ["blocking", "cookies", "form"] }
